name: ci

# DISABLED IN GITHUB ACTIONS -- run `scripts/gate.sh` locally instead.
#
# This file is kept, not deleted: re-enabling is `gh workflow enable ci`.
# It is disabled for cost. GitHub bills Windows at 2x and macOS at ~10x
# against the org's included minutes, and this workflow fired on every PR
# *and* again on the merge commit to main, so one change paid for the matrix
# twice. Over 14 days the two per-PR workflows in this repo burned ~2,154
# wall-clock minutes at a 66% failure rate -- failed runs bill too.
#
# The gate now runs before commit, via `npm run gate` (= scripts/gate.sh).
# Known gap: that runs on one host, so clippy's `cfg(not(windows))` arms and
# any macOS-only test path go unchecked until someone runs it on a Mac or
# re-enables this workflow. Do one of those before releasing a change to
# platform-conditional code -- a macOS-only startup bug shipped that way once.

# Quality gates: format, lint, and the full frontend + Rust test suites,
# on the same platforms desktop-build.yml ships (macOS, Windows) so a
# platform-only test (e.g. the macOS/Linux branches in
# src-tauri/src/projects/tests/platform_conformance.rs) is actually
# exercised, not just compiled. Runs on every push to main and every PR.
#
# desktop-build.yml no longer runs any of this: it assumes main is already
# green from this workflow and only builds/signs/releases (workflow_dispatch).
# Splitting the two means cutting a release doesn't re-pay ~1h of test time
# that already ran on the merge that put main in a releasable state.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # macOS universal build needs both arch targets available.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Cache cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-deny.exe
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-0.19.4

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.19.4 --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend quality gates
        run: |
          npm run format:check
          npm run lint
          npm test

      - name: Rust quality and policy gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          cargo deny check
