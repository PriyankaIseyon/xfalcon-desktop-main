name: desktop-promote-staging
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version to advertise to staging clients (e.g. 0.5.5)"
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-staging-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: desktop-staging
    permissions:
      contents: read
      id-token: write
    env:
      DESKTOP_UPDATE_BASE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: arn:aws:iam::572186105468:role/xfalcon-desktop-artifacts-staging-publisher
          aws-region: us-east-1
          allowed-account-ids: "572186105468"
      - name: Verify candidate and delivery, then advance staging channel
        run: node scripts/publish-desktop-staging.mjs promote "$RELEASE_VERSION"

  cleanup-releases:
    if: github.ref == 'refs/heads/staging'
    needs: promote
    concurrency:
      group: desktop-release-cleanup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify release cleanup
        run: node --test scripts/cleanup-desktop-releases.test.mjs
      - name: Keep five rolling GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: node scripts/cleanup-desktop-releases.mjs "$RELEASE_TAG"
